services:
  gestor:
    build: .
    container_name: conectaso-gestor
    restart: unless-stopped
    # Solo interno: Caddy (puertos 80 y 443) le hace de proxy. Así el dominio redirige a HTTPS
    # y el acceso por IP sigue funcionando por HTTP a través de Caddy.
    expose:
      - "3000"
    env_file:
      - .env
    volumes:
      # Base de datos y archivos subidos (persisten aunque se reconstruya el contenedor).
      - ./data:/data

  # Proxy: HTTPS automático (Let's Encrypt) para el dominio + redirección HTTP→HTTPS.
  # Ocupa 80 y 443; reenvía todo a 'gestor'. El acceso por IP (HTTP) sigue funcionando.
  caddy:
    image: caddy:2-alpine
    container_name: conectaso-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gestor

  # App del préstamo: independiente de la intranet (otro contenedor, puerto 8080 y datos propios).
  prestamo:
    build: ./prestamo
    container_name: conectaso-prestamo
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data-prestamo:/data

  # App de seguros: independiente de la intranet (otro contenedor, puerto 8081 y datos propios).
  seguros:
    build: ./seguros
    container_name: conectaso-seguros
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./data-seguros:/data

  # App de la reforma: independiente de la intranet (otro contenedor, puerto 8082 y datos propios).
  # Se abre en http://IP:8082
  reforma:
    build: ./reforma
    container_name: conectaso-reforma
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ./data-reforma:/data

volumes:
  # Certificados y estado de Caddy (persisten para no re-emitir el certificado en cada despliegue).
  caddy_data:
  caddy_config:
